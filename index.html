<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LomboQuest</title>
<meta name="description" content="LomboQuest : des exercices doux pour le dos, en mode quête quotidienne. Gratuit, sans pub, sans compte.">
<link rel="icon" href="img/icone.png">
<style>
  :root {
    --bg: #14171F; --bg2: #1B2030; --card: #1F2536; --line: #2C3448;
    --gold: #D9A93E; --text: #EDE3CC; --muted: #A9A595; --blue: #28497D;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--gold); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

  /* Barre du haut */
  .top { display: flex; justify-content: flex-end; gap: 6px; padding: 14px 0; flex-wrap: wrap; }
  .top button { background: transparent; color: var(--muted); border: 1px solid var(--line);
                border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .top button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--bg); font-weight: 600; }

  /* En-tête */
  .hero { display: flex; align-items: center; gap: 32px; padding: 32px 0 48px; }
  .hero img { width: 140px; height: 140px; border-radius: 32px; flex: none;
              box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .hero h1 { margin: 0; font-size: clamp(40px, 7vw, 64px); line-height: 1.05; color: var(--gold); letter-spacing: -1px; }
  .hero .tag { margin: 10px 0 6px; font-size: clamp(18px, 2.6vw, 24px); font-weight: 600; }
  .hero .intro { margin: 0 0 18px; color: var(--muted); max-width: 560px; }
  .pills { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .badge { background: var(--bg2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
  .cta { background: var(--gold); color: var(--bg); border-radius: 999px; padding: 8px 18px; font-weight: 700; font-size: 15px; }

  h2 { font-size: 24px; margin: 0 0 18px; }

  /* Captures */
  .shots { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory;
           padding: 4px 4px 18px; margin: 0 -4px; }
  .shots img { width: 230px; height: auto; flex: none; border-radius: 18px; scroll-snap-align: start;
               box-shadow: 0 8px 28px rgba(0,0,0,.45); }
  .shots::-webkit-scrollbar { height: 8px; }
  .shots::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  /* Fonctionnalités */
  .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin: 48px 0; }
  .feat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
  .feat .ico { font-size: 26px; }
  .feat h3 { margin: 6px 0 4px; font-size: 18px; color: var(--gold); }
  .feat p { margin: 0; color: var(--muted); font-size: 15px; }

  .warn { background: var(--bg2); border-left: 4px solid var(--gold); border-radius: 8px;
          padding: 12px 16px; color: var(--muted); font-size: 15px; }

  footer { border-top: 1px solid var(--line); margin-top: 48px; padding: 24px 0 40px;
           display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; color: var(--muted); font-size: 14px; }
  footer a { text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer .langs { flex-basis: 100%; }

  @media (max-width: 640px) {
    .hero { flex-direction: column; text-align: center; gap: 18px; padding-top: 12px; }
    .hero img { width: 110px; height: 110px; border-radius: 26px; }
    .hero .intro { margin-left: auto; margin-right: auto; }
    .pills { justify-content: center; }
    .shots img { width: 200px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="top" aria-label="Langue">
    <button data-l="fr">Français</button>
    <button data-l="en">English</button>
    <button data-l="de">Deutsch</button>
    <button data-l="ru">Русский</button>
  </nav>

  <section class="hero">
    <img src="img/icone.png" alt="LomboQuest">
    <div>
      <h1>LomboQuest</h1>
      <p class="tag" data-t="tag"></p>
      <p class="intro" data-t="intro"></p>
      <div class="pills">
        <span class="cta" data-t="cta"></span>
        <span class="badge" data-t="badge"></span>
      </div>
    </div>
  </section>

  <h2 data-t="shots"></h2>
  <div class="shots" id="shots"></div>

  <div class="features">
    <div class="feat"><div class="ico">🧍</div><h3 data-t="f1t"></h3><p data-t="f1d"></p></div>
    <div class="feat"><div class="ico">🏆</div><h3 data-t="f2t"></h3><p data-t="f2d"></p></div>
    <div class="feat"><div class="ico">🛌</div><h3 data-t="f3t"></h3><p data-t="f3d"></p></div>
    <div class="feat"><div class="ico">📊</div><h3 data-t="f4t"></h3><p data-t="f4d"></p></div>
    <div class="feat"><div class="ico">🔔</div><h3 data-t="f5t"></h3><p data-t="f5d"></p></div>
    <div class="feat"><div class="ico">🔒</div><h3 data-t="f6t"></h3><p data-t="f6d"></p></div>
  </div>

  <p class="warn" data-t="warn"></p>

  <footer>
    <a id="privacy" href="privacy.html" data-t="privacy"></a>
    <a href="mailto:lomboquest.app@proton.me" data-t="contact"></a>
    <a href="https://fr.tipeee.com/freyrstudio" rel="noopener" data-t="support"></a>
    <span class="langs" data-t="langs"></span>
    <span>© 2026 FreyrStudio</span>
  </footer>
</div>

<script>
var T = {
  fr: {

    cta: "Bientôt sur Google Play", badge: "Gratuit · Sans pub · Sans compte", shots: "Aperçu",
    f1t: "Exercices guidés", f1d: "Animations claires, chronomètre et séance guidée qui enchaîne tout pour toi.",
    f2t: "La motivation d'un jeu", f2d: "XP, rangs, série de jours, quêtes quotidiennes et 60 trophées.",
    f3t: "Journée difficile", f3d: "Une séance allégée pour les jours où ça tire.",

    f6t: "Ta vie privée d'abord", f6d: "Aucun compte, aucun traceur : tes données restent sur ton téléphone.",
    warn: "⚠️ LomboQuest ne remplace pas l'avis d'un médecin ou d'un kinésithérapeute.",

    f1t: "Guided exercises", f1d: "Clear animations, a timer and a guided session that chains everything for you.",
    f2t: "The motivation of a game", f2d: "XP, ranks, daily streak, daily quests and 60 trophies.",
    f3t: "Tough day", f3d: "A lighter session for the days when it hurts.",
    f4t: "Simple tracking", f4d: "Pain log, calendar, weight tracking and PDF export for your doctor or physiotherapist.",
    f5t: "Reminders and widgets", f5d: "Reminders at the time you choose and widgets in three sizes.",
    f6t: "Your privacy comes first", f6d: "No account, no trackers: your data stays on your phone.",
    warn: "⚠️ LomboQuest does not replace the advice of a doctor or physiotherapist.",
    privacy: "Privacy policy", contact: "Contact", support: "❤️ Support me",
    langs: "Available in English, French, German and Russian."
  },
  de: {
    tag: "Sanfte Rückenübungen als tägliche Quest.",
    intro: "LomboQuest verwandelt deine Übungen für den unteren Rücken in ein kleines Abenteuer: ein paar Minuten am Tag, Motivation und Belohnungen für jede Einheit.",
    cta: "Bald bei Google Play", badge: "Kostenlos · Keine Werbung · Kein Konto", shots: "Einblicke",
    f1t: "Geführte Übungen", f1d: "Klare Animationen, Timer und eine geführte Einheit, die alles für dich aneinanderreiht.",

    f3t: "Schwerer Tag", f3d: "Eine leichtere Einheit für Tage, an denen es zieht.",
    f4t: "Einfaches Tracking", f4d: "Schmerztagebuch, Kalender, Gewichtskurve und PDF-Export für Arzt oder Physiotherapeuten.",
    f5t: "Erinnerungen und Widgets", f5d: "Erinnerungen zur Uhrzeit deiner Wahl und Widgets in drei Größen.",

    privacy: "Datenschutzerklärung", contact: "Kontakt", support: "❤️ Unterstütze mich",
    langs: "Verfügbar auf Deutsch, Englisch, Französisch und Russisch."
  },
  ru: {
    tag: "Мягкие упражнения для спины в формате ежедневного квеста.",
    intro: "LomboQuest превращает упражнения для поясницы в маленькое приключение: несколько минут в день, мотивация и награды за каждую тренировку.",
    cta: "Скоро в Google Play", badge: "Бесплатно · Без рекламы · Без аккаунта", shots: "Скриншоты",
    f1t: "Упражнения с подсказками", f1d: "Понятные анимации, таймер и тренировка, которая ведёт тебя от упражнения к упражнению.",
    f2t: "Мотивация как в игре", f2d: "XP, ранги, серия дней, ежедневные задания и 60 трофеев.",
    f3t: "Тяжёлый день", f3d: "Облегчённая тренировка для дней, когда спина ноет.",
    f4t: "Простой учёт", f4d: "Дневник боли, календарь, учёт веса и экспорт в PDF для врача или физиотерапевта.",
    f5t: "Напоминания и виджеты", f5d: "Напоминания в удобное время и виджеты трёх размеров.",
    f6t: "Конфиденциальность прежде всего", f6d: "Без аккаунта и трекеров: твои данные остаются на телефоне.",
    warn: "⚠️ LomboQuest не заменяет консультацию врача или физиотерапевта.",
    privacy: "Политика конфиденциальности", contact: "Связаться", support: "❤️ Поддержать меня",
    langs: "Доступно на французском, английском, немецком и русском."
  }
};
// Captures disponibles : fr, en, de (le russe affiche les captures anglaises)
var IMG = { fr: "fr", en: "en", de: "de", ru: "en" };

function show(l) {
  var t = T[l];
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t[el.dataset.t]; });
  document.querySelectorAll(".top button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.l === l); });
  document.getElementById("privacy").href = "privacy.html#" + l;
  var html = "";
  for (var i = 1; i <= 7; i++) html += '<img loading="lazy" src="img/' + IMG[l] + '/' + i + '.webp" alt="' + t.shots + ' ' + i + '">';
  document.getElementById("shots").innerHTML = html;
}
document.querySelectorAll(".top button").forEach(function (b) {
  b.addEventListener("click", function () { show(b.dataset.l); history.replaceState(null, "", "#" + b.dataset.l); });
});
var h = location.hash.slice(1), nav = (navigator.language || "en").slice(0, 2).toLowerCase();
show(T[h] ? h : (T[nav] ? nav : "en"));
</script>
</body>
</html>
